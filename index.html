<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Moropoly: the Moroccan property game for 2 to 8 players.">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moropoly">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta property="og:title" content="Moropoly">
<meta property="og:description" content="Join my game of Moropoly, the Moroccan property game.">
<meta property="og:image" content="icons/icon-512.png">
<title>Moropoly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
</head>
<body>


<div id="app">
<!-- ================= HOME ================= -->
<section id="home" class="wrap"></section>

<!-- ================= LOCAL SETUP ================= -->
<section id="setup" class="wrap screen" hidden></section>

<!-- ================= LOBBY ================= -->
<section id="lobby" class="wrap screen" hidden></section>

<!-- ================= GAME ================= -->
<section id="game" class="wrap screen" hidden>
  <div class="gamebar" id="gameBar"></div>
  <div id="bannerSlot"></div>
  <div class="layout">
    <div class="board-wrap"><div class="board-box"><div class="board" id="board"></div></div></div>
    <aside class="side">
      <div class="turn" id="turnCard"></div>
      <div id="sideTabs"></div>
    </aside>
  </div>
</section>
</div>
<div class="dock" id="dock"></div>
<div id="windows"></div>
<div id="reactModal" data-react></div>
<div class="toasts" id="toasts"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
