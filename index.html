<style>
/* Layout: a graphite room lit like brushed steel. Flag red and flag green are the only colours of intent; silver carries structure (frames, rings, borders). Board = silver frame, white-steel tiles, deep-green centre. */
:root{
  color-scheme:dark;
  --bg:#0b0d10; --bg-2:#111419; --panel:#171b21; --panel-2:#1f242c; --panel-3:#272d36;
  --line:rgba(206,213,223,.13); --line-2:rgba(206,213,223,.3);
  --text:#eef1f5; --dim:#9aa3af; --faint:#69717c;
  --silver:#c9cfd8; --silver-hi:#f4f6f9; --silver-lo:#7f8792;
  --red:#c1272d; --red-hi:#e8474d; --green:#006233; --green-hi:#17a862; --green-deep:#062a19;
  --gold:#e3b34a;
  --tile:#f4f5f7; --tile-2:#e3e6ea; --ink:#15181d; --ink-dim:#59616c;
  --metal:linear-gradient(135deg,#f5f7fa 0%,#c3c9d2 18%,#eef1f4 36%,#8f97a2 58%,#e7eaee 78%,#b4bbc5 100%);
  --metal-soft:linear-gradient(160deg,#2b313a,#1a1e24 55%,#252b33);
  --f-display:"Unbounded","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic","Noto Sans Tifinagh",system-ui,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
  --f-tif:"Noto Sans Tifinagh","IBM Plex Sans",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit}
:focus-visible{outline:2px solid var(--silver-hi);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:999px;padding:10px 18px;font-weight:600;color:var(--text);transition:transform .15s,border-color .15s,background .15s}
.btn:hover:not(:disabled){border-color:var(--silver);transform:translateY(-1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.red{background:var(--red);border-color:var(--red-hi);color:#fff}
.btn.red:hover:not(:disabled){background:var(--red-hi)}
.btn.green{background:var(--green);border-color:var(--green-hi);color:#fff}
.btn.green:hover:not(:disabled){background:#007a40}
.btn.metal{background:var(--metal);color:var(--ink);border-color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{background:transparent;border-color:var(--red-hi);color:var(--red-hi)}
.field{background:var(--bg-2);border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;color:var(--text);min-width:0}
.muted{color:var(--dim)}
.eyebrow{font-family:var(--f-display);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--silver)}
h1,h2,h3{text-wrap:balance}
.noimg{visibility:hidden}

/* ---------- HOME ---------- */
#home{padding-block:14px 60px;position:relative}
.home-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:6px 10px}
#flag{width:84px;height:58px;flex:0 0 auto}
.wm{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.1em;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.wm .ar{font-family:var(--f-ar);font-weight:700;letter-spacing:0;margin-inline-start:10px}
.wm .tif{font-family:var(--f-tif);font-weight:400;font-size:15px;letter-spacing:.14em;margin-inline-start:10px}
.home-top .sp{flex:1}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:center;margin-top:10px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,5.4vw,64px);line-height:1.02;margin:14px 0 14px;letter-spacing:-.01em}
.hero h1 .r{color:var(--red-hi)} .hero h1 .g{color:var(--green-hi)}
.hero h1 .s{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:16.5px;color:var(--dim);max-width:52ch;margin:0 0 22px}
.ctas{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.joinrow{display:flex;gap:8px;margin-top:14px;max-width:420px}
.joinrow .field{flex:1;text-transform:lowercase;letter-spacing:.12em;font-family:var(--f-display);font-size:14px}
.note{font-size:12.5px;color:var(--dim);margin-top:12px;max-width:56ch}
.mygames{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hero-map{position:relative;min-width:0}
.hero-map svg{width:100%;height:auto;display:block;max-height:640px}
.map-land{fill:url(#landGrad);stroke:var(--silver);stroke-width:1.4;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 3.2s ease forwards .2s;fill-opacity:0}
@keyframes draw{60%{stroke-dashoffset:0;fill-opacity:0}100%{stroke-dashoffset:0;fill-opacity:1}}
.map-route{fill:none;stroke:var(--red-hi);stroke-width:2;stroke-dasharray:5 6;opacity:0;animation:fadein .8s 2.6s forwards,dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
@keyframes fadein{to{opacity:1}}
.city{opacity:0;animation:fadein .5s forwards}
.city .dot{fill:var(--silver-hi)}
.city .pulse{fill:none;stroke:var(--green-hi);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}
.city text{font-family:var(--f-body);font-size:11px;fill:var(--text);font-weight:600}
.city text.ar{font-family:var(--f-ar);font-size:10px;fill:var(--dim);font-weight:400}
.train{opacity:0;animation:fadein .6s 3s forwards}
.parade{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:44px 0 10px}
.coin{width:76px;height:76px;border-radius:50%;padding:4px;background:var(--metal);box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.6);position:relative;flex:0 0 auto}
.coin img,.coin .g{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:#20252c;font-size:30px}
.parade .coin{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.parade .coin:hover{animation-play-state:paused;transform:scale(1.08)}
.parade .coin span{position:absolute;left:50%;top:100%;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:var(--dim);margin-top:6px}
.marquee{overflow:hidden;margin-top:26px;-webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;gap:14px;width:max-content;animation:scroll 70s linear infinite}
.marquee.rev .track{animation-direction:reverse;animation-duration:85s}
.marquee:hover .track{animation-play-state:paused}
@keyframes scroll{to{transform:translateX(-50%)}}
.mcard{width:132px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;position:relative;background:var(--panel-2);border:1px solid var(--line-2);flex:0 0 auto}
.mcard img{width:100%;height:100%;object-fit:cover;display:block}
.mcard .cap{position:absolute;inset:auto 0 0 0;padding:20px 8px 6px;font-size:11px;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.mcard .bar{position:absolute;inset:0 0 auto 0;height:5px}
.feats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:44px}
@media (max-width:900px){.feats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.feats{grid-template-columns:minmax(0,1fr)}}
.feat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.feat .k{font-family:var(--f-ar);font-weight:700;font-size:26px;line-height:1}
.feat h3{font-family:var(--f-display);font-size:14px;margin:8px 0 4px;letter-spacing:.04em}
.feat p{margin:0;color:var(--dim);font-size:13px}
.sketch{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center;margin-top:44px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}
@media (max-width:800px){.sketch{grid-template-columns:minmax(0,1fr)}}
.sketch img{width:100%;border-radius:12px;display:block}

/* ---------- SETUP / LOBBY ---------- */
.screen{padding-block:14px 50px}
.bar-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bar-top .sp{flex:1}
.mini-flag{width:30px;height:20px;border-radius:3px;background:var(--red);position:relative;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.mini-flag svg{position:absolute;inset:0;margin:auto;width:13px;height:13px}
.h2{font-family:var(--f-display);font-size:22px;margin:4px 0 4px}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.seat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;min-width:0}
.seat.off{opacity:.45}
.seat .coin{width:56px;height:56px;padding:3px}
.seat .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.seat .info .field{padding:6px 10px;border-radius:9px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;align-self:flex-start}
.seg button{background:none;border:0;padding:4px 10px;font-size:12px;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--panel-3);color:var(--text)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.opt b{display:block}
.opt span{color:var(--dim);font-size:12.5px}
.opt select{margin-top:6px;padding:6px 8px}
.sec{font-family:var(--f-display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--silver);margin:26px 0 10px}
.tokgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;max-width:520px}
.tok{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--dim);position:relative}
.tok .coin{width:100%;max-width:78px;height:auto;aspect-ratio:1}
.tok[aria-pressed="true"] .coin{box-shadow:0 0 0 3px var(--green-hi),0 10px 30px rgba(0,0,0,.5)}
.tok[aria-pressed="true"]{color:var(--text)}
.tok:disabled{opacity:.3;cursor:not-allowed}
.tok .taken{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);background:var(--red);color:#fff;border-radius:6px;padding:1px 6px;font-size:10px;font-weight:700}
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.lobby{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.invite{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.invite .field{flex:1;min-width:0;font-size:12.5px}
.code{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.2em;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.roster{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:10px;background:var(--panel-2);border-radius:12px;padding:8px 10px}
.rrow .coin{width:40px;height:40px;padding:2px}
.rrow .n{font-weight:600}
.rrow .sp{flex:1;min-width:0}
.dotst{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block;margin-inline-end:6px}
.dotst.on{background:var(--green-hi);box-shadow:0 0 8px var(--green-hi)}

/* ---------- GAME ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:20px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}}
.board-wrap{display:flex;justify-content:center;min-width:0}
.board-box{container-type:inline-size;container-name:board;width:min(100%,calc(100vh - 92px),1000px)}
.board{width:100%;aspect-ratio:1;position:relative;display:grid;grid-template-columns:1.6fr repeat(9,1fr) 1.6fr;grid-template-rows:1.6fr repeat(9,1fr) 1.6fr;gap:.3cqi;padding:1.6cqi;box-sizing:border-box;border-radius:2cqi;background:var(--metal);box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 .25cqi rgba(255,255,255,.7)}
.board::before{content:"";position:absolute;inset:1.05cqi;border-radius:1.2cqi;background:linear-gradient(90deg,var(--red) 0 50%,var(--green) 50%);pointer-events:none;z-index:0}
.board::after{content:"";position:absolute;inset:1.5cqi;border-radius:.9cqi;background:#1a1e24;pointer-events:none;z-index:0}
.cell{position:relative;overflow:hidden;display:flex;min-width:0;min-height:0;cursor:pointer;background:linear-gradient(180deg,#fafbfc,var(--tile-2));color:var(--ink);font-size:1.25cqi;line-height:1.1;text-align:center;border-radius:.45cqi;z-index:1}
.cell:hover{filter:brightness(1.05)}
.cell .bar{flex:0 0 17%;display:flex;align-items:center;justify-content:center;gap:.35cqi;position:relative}
.cell .art{flex:0 0 38%;min-height:0;min-width:0;overflow:hidden;position:relative}
.cell .art img{width:100%;height:100%;object-fit:cover;display:block}
.cell .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25cqi;padding:.3cqi;min-width:0;min-height:0}
.cell .nm{font-weight:700;font-size:1.12cqi;text-wrap:balance;overflow-wrap:anywhere}
.cell .pr{font-size:1.05cqi;font-variant-numeric:tabular-nums;color:var(--ink-dim);font-weight:600}
.cell .ico{font-family:var(--f-ar);font-weight:700;font-size:2.1cqi;line-height:1}
.cell .glyph{font-size:2.2cqi;line-height:1}
.s-b{flex-direction:column}.s-t{flex-direction:column-reverse}.s-l{flex-direction:row-reverse}.s-r{flex-direction:row}
.s-l .bar,.s-r .bar{flex-basis:14%;flex-direction:column}
.s-l .art,.s-r .art{flex-basis:34%}
.own{position:absolute;pointer-events:none}
.s-b .own{left:0;right:0;bottom:0;height:1cqi}.s-t .own{left:0;right:0;top:0;height:1cqi}.s-l .own{top:0;bottom:0;left:0;width:1cqi}.s-r .own{top:0;bottom:0;right:0;width:1cqi}
.cell.mort .body{background:repeating-linear-gradient(135deg,transparent 0 .7cqi,rgba(193,39,45,.14) .7cqi 1.3cqi)}
.cell.mort .art{filter:grayscale(1) opacity(.5)}
.dar{width:1.05cqi;height:1.05cqi;background:var(--green);border:.14cqi solid #fff;border-radius:.2cqi;box-shadow:0 .1cqi .3cqi rgba(0,0,0,.35)}
.riad{width:2cqi;height:1.3cqi;background:var(--red);border:.16cqi solid #fff;border-radius:.3cqi;display:grid;place-items:center;color:#fff;font-size:.9cqi}
.pop{animation:popin .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes popin{0%{transform:scale(0)}100%{transform:scale(1)}}
.corner{flex-direction:column;align-items:center;justify-content:center;gap:.4cqi;padding:.6cqi;color:#fff}
.corner .big{font-family:var(--f-ar);font-weight:700;font-size:2.5cqi;line-height:1.05}
.corner .lat{font-family:var(--f-display);font-weight:700;font-size:1.25cqi;letter-spacing:.06em}
.corner .tiny{font-size:1cqi;opacity:.85}
.c-go{background:linear-gradient(150deg,#d8343a,#8e1a1f)}
.c-go .arrow{font-size:3.4cqi;line-height:.8}
.c-jail{background:linear-gradient(150deg,#3a414b,#1a1e24)}
.c-jail .bars{width:62%;height:4.2cqi;background:repeating-linear-gradient(90deg,var(--silver) 0 .4cqi,transparent .4cqi 1.3cqi);border:.3cqi solid var(--silver);border-radius:.3cqi;overflow:hidden;position:relative}
.c-jail .bars img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;mix-blend-mode:luminosity}
.c-park{background:linear-gradient(150deg,#0a7a43,#033a20)}
.c-park .pot{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.4cqi;background:var(--metal);color:var(--ink);border-radius:2cqi;padding:.2cqi 1cqi}
.c-gojail{background:linear-gradient(150deg,#2a3038,#111418)}
.c-gojail .big{color:var(--red-hi)}
.cell.land{box-shadow:inset 0 0 0 .4cqi var(--gold);z-index:2}
@container board (max-width:600px){.cell .art{display:none}.cell .nm{font-size:1.45cqi}.cell .pr{font-size:1.3cqi}.corner .tiny{display:none}}
.center{grid-area:2/2/11/11;position:relative;z-index:1;border-radius:1cqi;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#0c4a2c,var(--green-deep) 60%,#03140c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqi;color:#fff}
.center .star{position:absolute;inset:0;margin:auto;width:70%;height:70%;opacity:.12;pointer-events:none}
.center .star path{stroke:var(--silver-hi)}
.center>*{position:relative}
.ttl{display:flex;flex-direction:column;align-items:center;line-height:1}
.ttl .tif{font-family:var(--f-tif);font-size:2cqi;letter-spacing:.34em;color:var(--silver)}
.ttl .ar{font-family:var(--f-ar);font-weight:700;font-size:5.6cqi;line-height:1.35;margin-top:.2cqi;color:#fff}
.ttl .lat{font-family:var(--f-display);font-weight:800;font-size:4.6cqi;letter-spacing:.14em;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.dice{display:flex;gap:3cqi;perspective:60cqi;--ds:7cqi;height:var(--ds)}
.die{width:var(--ds);height:var(--ds);position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.9,.25,1.05)}
.face{position:absolute;inset:0;border-radius:1.2cqi;background:linear-gradient(145deg,#fff,#dfe3e8);box-shadow:inset 0 0 0 .25cqi rgba(0,0,0,.08);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:1cqi;box-sizing:border-box;backface-visibility:hidden}
.face i{width:1.3cqi;height:1.3cqi;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.face.f1 i:nth-child(5){background:var(--red)}
.f1{transform:translateZ(calc(var(--ds)/2))}.f6{transform:rotateY(180deg) translateZ(calc(var(--ds)/2))}
.f2{transform:rotateY(90deg) translateZ(calc(var(--ds)/2))}.f5{transform:rotateY(-90deg) translateZ(calc(var(--ds)/2))}
.f3{transform:rotateX(90deg) translateZ(calc(var(--ds)/2))}.f4{transform:rotateX(-90deg) translateZ(calc(var(--ds)/2))}
.dice.jump .die{animation:diehop 1s ease}
@keyframes diehop{0%{translate:0 0}30%{translate:0 -4cqi}60%{translate:0 0}75%{translate:0 -1cqi}100%{translate:0 0}}
.event{max-width:64cqi;min-height:2.4cqi;text-align:center;font-size:1.75cqi;font-weight:500;color:#e7efe9;padding:0 2cqi}
.stage{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5}
.reveal{width:24cqi;aspect-ratio:2/3;border-radius:1.4cqi;overflow:hidden;box-shadow:0 2cqi 5cqi rgba(0,0,0,.6),0 0 0 .4cqi #fff;background:var(--metal);animation:flipin .7s cubic-bezier(.2,.9,.3,1.2) both;position:relative}
.reveal img{width:100%;height:100%;object-fit:cover;display:block}
.reveal .cap{position:absolute;inset:auto 0 0;padding:4cqi 1.2cqi 1cqi;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;font-weight:700;font-size:1.8cqi;text-align:center}
.reveal.out{animation:flipout .45s ease-in forwards}
@keyframes flipin{0%{transform:perspective(80cqi) rotateY(90deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes flipout{to{transform:perspective(80cqi) rotateY(-90deg) scale(.7);opacity:0}}
.fate{width:38cqi;border-radius:1.6cqi;padding:2cqi 2.4cqi;text-align:center;color:#fff;box-shadow:0 2cqi 5cqi rgba(0,0,0,.55),0 0 0 .35cqi rgba(255,255,255,.85);animation:flipin .6s cubic-bezier(.2,.9,.3,1.2) both}
.fate.mektoub{background:linear-gradient(150deg,#d43a40,#7e161b)}
.fate.baraka{background:linear-gradient(150deg,#0b8a4c,#03401f)}
.fate .k{font-family:var(--f-ar);font-weight:700;font-size:4cqi;line-height:1}
.fate .kl{font-family:var(--f-display);letter-spacing:.2em;font-size:1.1cqi;text-transform:uppercase;opacity:.85;margin-top:.4cqi}
.fate .tx{font-size:1.9cqi;margin-top:1.2cqi;line-height:1.3}
.fate.out{animation:flipout .45s ease-in forwards}
.fate{pointer-events:auto;cursor:pointer;position:relative;overflow:hidden;width:46cqi}.fate .tx{font-size:2.5cqi}
.fate .tap{font-size:1.25cqi;opacity:.7;margin-top:1.4cqi}
.fate .timer{position:absolute;left:0;bottom:0;height:.6cqi;width:100%;background:rgba(255,255,255,.75);transform-origin:left;animation:fatetime linear forwards}
@keyframes fatetime{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (max-width:700px){.fate{width:66cqi}.fate .tx{font-size:3.8cqi}.fate .tap{font-size:2.4cqi}.fate .kl{font-size:2cqi}}
.btn.gold{border-color:rgba(227,179,74,.55);color:#f1cf7f}
#modalRoot.min .veil{display:none}
.modal-pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:56;border:1px solid rgba(227,179,74,.6);background:linear-gradient(180deg,#2a2f37,#15181d);color:var(--text);padding:12px 18px;border-radius:999px;font-weight:700;box-shadow:0 14px 40px rgba(0,0,0,.6);max-width:calc(100% - 32px);animation:pillpulse 1.6s ease-in-out infinite}
@keyframes pillpulse{0%,100%{box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 0 0 rgba(227,179,74,.45)}50%{box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 0 8px rgba(227,179,74,0)}}
#modalRoot:not(.min) .modal-pill{display:none}
@media (max-width:700px){body.ingame .modal-pill{bottom:calc(120px + env(safe-area-inset-bottom,0px))}}
.pawnlayer{position:absolute;inset:0;pointer-events:none;z-index:6}
.pawn{position:absolute;left:0;top:0;width:var(--ps);height:var(--ps);border-radius:50%;padding:.28cqi;box-sizing:border-box;background:var(--metal);box-shadow:0 .5cqi 1.2cqi rgba(0,0,0,.5);will-change:transform}
.pawn img,.pawn .g{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-size:2cqi;background:#222}
.pawn::after{content:"";position:absolute;inset:-.25cqi;border-radius:50%;border:.35cqi solid var(--pc)}
.pawn.cur{z-index:3}
.pawn.cur::before{content:"";position:absolute;inset:-1cqi;border-radius:50%;border:.3cqi solid var(--gold);animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.35);opacity:0}}
.pawn.jailed img{filter:grayscale(.6)}
.floater{position:absolute;z-index:8;font-family:var(--f-display);font-weight:800;font-size:2cqi;pointer-events:none;white-space:nowrap;text-shadow:0 .2cqi .6cqi rgba(0,0,0,.7);animation:floatup 1.5s ease-out forwards}
.floater.plus{color:#7dffb4}.floater.minus{color:#ff8a8f}.floater.gold{color:var(--gold)}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-1cqi) scale(1.15);opacity:1}100%{transform:translate(-50%,-7cqi) scale(1);opacity:0}}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:9;width:100%;height:100%}
.jailbars{position:absolute;z-index:8;pointer-events:none;background:repeating-linear-gradient(90deg,var(--silver-hi) 0 .5cqi,transparent .5cqi 1.5cqi);border-top:.5cqi solid var(--silver-hi);border-bottom:.5cqi solid var(--silver-hi);animation:slam .9s cubic-bezier(.5,0,.5,1.4) forwards}
@keyframes slam{0%{transform:translateY(-120%);opacity:0}50%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0}}

.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.turn{background:var(--metal-soft);border:1px solid var(--line-2);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.turn::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--red) 50%,var(--green) 50%)}
.who{display:flex;align-items:center;gap:12px}
.who .coin{width:52px;height:52px;padding:3px}
.who .n{font-family:var(--f-display);font-weight:700;font-size:15px}
.who .cash{font-family:var(--f-display);font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;font-size:15px}
.status{color:var(--dim);font-size:13px;min-height:1.4em}
.status b{color:var(--text)}
.status.bad{color:var(--red-hi)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.preview{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.25);border-radius:12px;padding:8px}
.preview img{width:52px;height:78px;object-fit:cover;border-radius:6px;flex:0 0 auto}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 10px;color:var(--dim);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--red-hi)}
.tabpanel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;max-height:58vh;overflow:auto;margin-top:8px}
@media (max-width:1000px){.tabpanel{max-height:none}}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--panel-2)}
.prow .coin{width:40px;height:40px;padding:2px}
.prow.active{box-shadow:inset 0 0 0 1px var(--gold)}
.prow.out{opacity:.4}
.prow .nm{font-weight:600}
.prow .sub{font-size:12px;color:var(--dim)}
.prow .money{text-align:end;font-variant-numeric:tabular-nums}
.prow .money b{display:block;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.chip{width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.chip.m{opacity:.3}
.deeds{display:flex;flex-direction:column;gap:6px}
.drow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel-2);padding:6px 8px;border-radius:12px}
.drow .th{width:40px;height:56px;border-radius:6px;overflow:hidden;background:var(--panel-3);position:relative}
.drow .th img{width:100%;height:100%;object-fit:cover}
.drow .th i{position:absolute;inset:0 0 auto;height:5px}
.drow .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.log{font-size:12.5px;display:flex;flex-direction:column;gap:5px}
.log div{border-bottom:1px dashed var(--line);padding-bottom:5px;color:var(--dim)}
.log div:first-child{color:var(--text)}
.book{max-width:65ch}
.book h3{font-family:var(--f-display);font-size:14px;margin:16px 0 6px;letter-spacing:.04em}
.book h3:first-child{margin-top:0}
.book p,.book li{font-size:13.5px}
.book ul{padding-inline-start:18px;margin:4px 0}
.book .k{font-family:var(--f-ar);color:var(--silver-hi);font-weight:600}
.book table{border-collapse:collapse;font-size:12.5px;width:100%}
.book td,.book th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:start;vertical-align:top}
.book .tw{overflow-x:auto}
.banner{background:rgba(193,39,45,.15);border:1px solid var(--red);color:#ffd6d8;border-radius:12px;padding:8px 12px;font-size:13px}
.gamebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.gamebar .sp{flex:1}
.chipcode{font-family:var(--f-display);font-size:12px;letter-spacing:.16em;border:1px solid var(--line-2);border-radius:999px;padding:5px 10px;color:var(--silver)}

/* modals */
.veil{position:fixed;inset:0;background:rgba(5,7,10,.72);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:20px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 40px 100px rgba(0,0,0,.6);animation:rise .3s ease}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.modal .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .hd h2{margin:0;font-family:var(--f-display);font-size:16px;flex:1;letter-spacing:.02em}
.modal .bd{padding:16px;display:flex;flex-direction:column;gap:12px}
.modal .ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{background:none;border:0;font-size:22px;color:var(--dim);line-height:1}
.deed{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:14px}
@media (max-width:520px){.deed{grid-template-columns:minmax(0,1fr)}}
.deed .artbig{border-radius:12px;overflow:hidden;background:var(--panel-2);aspect-ratio:2/3}
.deed .artbig img{width:100%;height:100%;object-fit:cover;display:block}
.deed .head{border-radius:10px;padding:10px;color:#fff;text-align:center}
.deed .head .ar{font-family:var(--f-ar);font-weight:700;font-size:18px}
.deed .head .lt{font-family:var(--f-display);font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.deed table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px;margin-top:8px}
.deed td{padding:5px 4px;border-bottom:1px solid var(--line)}
.deed td:last-child{text-align:end;font-weight:600}
.deed tr.hit td{color:var(--gold)}
.bidbig{font-family:var(--f-display);font-size:28px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.bidders{display:flex;flex-wrap:wrap;gap:6px}
.bidders span{padding:4px 10px;border-radius:999px;background:var(--panel-2);font-size:12.5px}
.bidders span.now{box-shadow:inset 0 0 0 1px var(--gold)}
.trade-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.trade-cols{grid-template-columns:1fr}}
.trade-cols h4{margin:0 0 6px;font-size:13px}
.trade-cols label{display:flex;gap:6px;align-items:center;font-size:13px;padding:3px 0}
.trade-cols input[type=number]{width:100%;box-sizing:border-box}
.toasts{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:70;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--metal);color:var(--ink);padding:9px 16px;border-radius:999px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:rise .25s ease}
/* music dock */
.dock{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40}
.dock-btn{width:50px;height:50px;border-radius:50%;border:0;background:var(--metal);color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.7);display:grid;place-items:center;font-size:20px;touch-action:manipulation}
.dock-btn .eq{display:none;gap:3px;align-items:flex-end;height:18px}
.dock-btn .eq i{width:3px;background:var(--red);border-radius:2px;animation:eq .9s ease-in-out infinite}
.dock-btn .eq i:nth-child(2){background:var(--green);animation-delay:.2s}.dock-btn .eq i:nth-child(3){animation-delay:.4s}.dock-btn .eq i:nth-child(4){background:var(--green);animation-delay:.1s}
.dock-btn.on .eq{display:flex}.dock-btn.on .note{display:none}
@keyframes eq{0%,100%{height:4px}50%{height:18px}}
.dock-panel{position:absolute;right:0;bottom:62px;width:min(310px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line-2);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:rise .2s ease}
.dk-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dk-row input[type=range]{flex:1;accent-color:var(--red)}
.dk-tracks{display:flex;flex-direction:column;gap:6px}
.dk-track{width:100%;color:inherit;font:inherit;cursor:pointer;display:flex;gap:10px;align-items:center;text-align:start;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.dk-track[aria-pressed="true"]{border-color:var(--green-hi);box-shadow:inset 0 0 0 1px var(--green-hi)}
.dk-track .ar{font-family:var(--f-ar);font-weight:700;font-size:15px;min-width:74px;color:var(--silver-hi)}
.dk-track small{display:block;color:var(--dim);font-size:11.5px}
.sw{width:44px;height:26px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel-3);position:relative;padding:0;flex:0 0 auto}
.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--silver);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--green)}.sw[aria-checked="true"] i{transform:translateX(18px);background:#fff}
button,.cell,.tok{touch-action:manipulation}
/* phones */
@media (max-width:700px){
  .hero h1{font-size:clamp(30px,9vw,44px)}
  .gamebar{gap:8px;margin-bottom:8px}.gamebar .wm{display:none}#roundMeta{font-size:12px}
  .screen{padding-block:8px 90px}
  .turn{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:20;padding:10px 12px;gap:8px;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
  .turn .who .coin{width:40px;height:40px}
  .turn .status{font-size:12.5px}
  .turn .actions .btn{padding:10px 14px}
  .turn .preview img{width:40px;height:60px}
  body.ingame .dock{bottom:auto;top:calc(8px + env(safe-area-inset-top,0px))}
  body.ingame .dock-btn{width:40px;height:40px;font-size:16px}
  body.ingame .dock-panel{bottom:auto;top:50px}
  body.ingame .gamebar{padding-right:48px}
  .feats{margin-top:30px}.parade .coin{width:58px;height:58px}
}
@container board (max-width:480px){
  .cell .art{display:block;flex:1 1 auto}
  .s-b .bar,.s-t .bar{flex-basis:14%}
  .cell.s-b .body,.cell.s-t .body,.cell.s-l .body,.cell.s-r .body{padding:.2cqi}
  .cell[data-t="prop"] .body{display:none}
  .cell .nm{font-size:1.9cqi;line-height:1}
  .cell .pr{display:none}
  .cell .glyph{font-size:3cqi}.cell .ico{font-size:2.6cqi}
  .cell[data-t="mektoub"] .nm,.cell[data-t="baraka"] .nm,.cell[data-t="tax"] .nm{display:none}
  .corner .lat{font-size:1.9cqi}.corner .big{font-size:3.2cqi}.c-park .pot{font-size:2cqi}
  .ttl .tif{display:none}
  .event{font-size:2.6cqi}
}
/* languages */
.langsw{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;flex:0 0 auto;direction:ltr}
.langsw button{background:none;border:0;padding:6px 10px;font-size:12px;font-weight:700;color:var(--dim);min-width:34px;letter-spacing:.04em}
.langsw button[aria-pressed="true"]{background:var(--metal);color:var(--ink)}
.langsw button[lang="ar"]{font-family:var(--f-ar);font-size:14px;line-height:1}
.board-box,#map,.marquee,.dice,.invite .field,.code{direction:ltr}
html[lang="ar"] .eyebrow,html[lang="ar"] .sec,html[lang="ar"] .chipcode,html[lang="ar"] .feat h3,html[lang="ar"] .corner .lat,html[lang="ar"] .fate .kl{letter-spacing:0}
html[lang="ar"] .hero h1,html[lang="ar"] .h2,html[lang="ar"] .feat h3,html[lang="ar"] .modal .hd h2,html[lang="ar"] .who .n,html[lang="ar"] .who .cash,html[lang="ar"] .book h3,html[lang="ar"] .sec,html[lang="ar"] .eyebrow,html[lang="ar"] .bidbig,html[lang="ar"] .floater{font-family:var(--f-ar)}
html[lang="ar"] .hero h1{line-height:1.3;font-weight:700}
html[lang="ar"] body{font-size:14.5px}
html[lang="ar"] .corner .lat:empty,html[lang="ar"] .cell .nm:empty{display:none}
html[lang="ar"] .cell .nm{font-family:var(--f-ar);font-size:1.25cqi}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.map-land{stroke-dashoffset:0;fill-opacity:1}}
</style>
</head>
<body>


<div id="app">
<!-- ================= HOME ================= -->
<section id="home" class="wrap">
  <div class="home-top">
    <canvas id="flag" width="168" height="116" data-i18n-aria="aria.flag"></canvas>
    <div class="wm">MOROPOLY<span class="ar">مُوروبولي</span><span class="tif">ⵎⵓⵔⵓⴱⵓⵍⵉ</span></div>
    <div class="sp"></div>
    <span class="eyebrow" data-i18n="home.players"></span><div class="langsw"></div>
  </div>
  <div class="hero">
    <div>
      <div class="eyebrow" data-i18n="home.eyebrow"></div>
      <h1 data-i18n="home.h1"></h1>
      <p class="lead" data-i18n="home.lead"></p>
      <div class="ctas">
        <button class="btn red" id="hostBtn" data-i18n="home.host"></button>
        <button class="btn" id="localBtn" data-i18n="home.local"></button>
        <button class="btn ghost" id="installBtn" hidden data-i18n="home.install"></button>
      </div>
      <form class="joinrow" id="joinForm" autocomplete="off">
        <input class="field" id="joinCode" maxlength="8" dir="ltr" data-i18n-ph="home.code" data-i18n-aria="home.code">
        <button class="btn green" type="submit" data-i18n="home.join"></button>
      </form>
      <div class="note" id="onlineNote"></div>
      <div class="mygames" id="myGames"></div>
    </div>
    <div class="hero-map"><svg id="map" viewBox="0 0 420 450" role="img" data-i18n-aria="aria.map"></svg></div>
  </div>
  <div class="parade" id="parade"></div>
  <div class="marquee"><div class="track" id="mq1"></div></div>
  <div class="marquee rev"><div class="track" id="mq2"></div></div>
  <div class="feats">
    <div class="feat"><div class="k" style="color:var(--red-hi)">الدلالة</div><h3 data-i18n="feat.dlala"></h3><p data-i18n="feat.dlalaP"></p></div>
    <div class="feat"><div class="k" style="color:var(--green-hi)">دارت</div><h3 data-i18n="feat.daret"></h3><p data-i18n="feat.daretP"></p></div>
    <div class="feat"><div class="k" style="color:var(--silver-hi)">مكتوب · بركة</div><h3 data-i18n="feat.cards"></h3><p data-i18n="feat.cardsP"></p></div>
    <div class="feat"><div class="k" style="color:var(--red-hi)">عكاشة</div><h3 data-i18n="feat.jail"></h3><p data-i18n="feat.jailP"></p></div>
  </div>
  <div class="sketch">
    <img src="assets/board.webp" alt="Moropoly board concept sketch">
    <div><div class="eyebrow" data-i18n="sk.eyebrow"></div><h2 class="h2" data-i18n="sk.h2"></h2><p class="muted" data-i18n="sk.p"></p></div>
  </div>
</section>

<!-- ================= LOCAL SETUP ================= -->
<section id="setup" class="wrap screen" hidden>
  <div class="bar-top"><button class="btn ghost sm" data-home data-i18n="back"></button><div class="sp"></div><div class="langsw"></div></div>
  <div class="eyebrow" data-i18n="setup.eyebrow"></div>
  <h2 class="h2" data-i18n="setup.h2"></h2>
  <p class="muted" data-i18n="setup.p"></p>
  <div class="seats" id="seats"></div>

function cardText(deck,id,fallback){
  if(id==null) return fallback||'';
  if(LANG==='en') return ((deck==='mektoub'?MEKTOUB:BARAKA)[id]||{}).text||fallback||'';
  return (CARD_TX[deck][LANG]||[])[id]||fallback||'';
}
/* render a structured log entry [key, params] in the viewer's language */
function tl(e){
  if(!e) return ''; if(typeof e==='string') return e;
  const [k,p0]=e; const p=Object.assign({},p0||{});
  if(p.a!=null) p.a=fmt(p.a);
  if(p.s!=null) p.s=spN(p.s);
  if(p.to!=null) p.to=p.to==='@daret'?t('w.daret'):p.to==='@bank'?t('w.bank'):p.to;
  if(p.why!=null) p.why=t('why.'+p.why,{s:p.s,d:p.d,r:p.r});
  if(p.deck!=null) p.deckN=t('deck.'+p.deck);
  if(p.card!=null) p.card=cardText(p.card[0],p.card[1],p.cardEn);
  return t('log.'+k,p);
}

/* apply language to static markup and the document */
function applyLang(){
  const html=document.documentElement; html.lang=LANG; html.dir=LANG==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.innerHTML=t(el.dataset.i18n);});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{el.placeholder=t(el.dataset.i18nPh);});
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.i18nAria));});
  document.querySelectorAll('.langsw').forEach(renderLangSwitch);
}

function renderLangSwitch(box){
  box.setAttribute('role','group'); box.setAttribute('aria-label',t('lang.aria'));
  box.innerHTML=LANGS.map(([k,s,n])=>`<button type="button" data-lang="${k}" aria-pressed="${LANG===k}" title="${n}" lang="${k}">${s}</button>`).join('');
  box.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
}


/* ============================================================
   ENGINE (pure on G; runs on the authority only)
   ============================================================ */
function A(G,o){G.seq=(G.seq||0)+1; o.n=G.seq; G.anims.push(o); if(G.anims.length>50) G.anims.splice(0,G.anims.length-50);}
function log(G,k,p){const e=[k,p||{}]; G.log.unshift(e); if(G.log.length>60) G.log.length=60; G.event=e;}
function freshGame(seats,settings,extra){
  extra=extra||{};
  const G={gid:rid(10),status:'play',mode:extra.mode||'local',code:extra.code||null,hostCid:extra.hostCid||null,
    players:seats.map((s,i)=>({id:i,cid:s.cid||null,name:s.name,token:s.token,human:!!s.human,color:COLORS[i],cash:START_CASH,pos:0,inJail:false,jailTurns:0,goojf:[],bankrupt:false,owes:-1,mt:''})),
    props:{},cur:0,phase:'roll',dice:[3,4],doubles:0,rollAgain:false,daret:0,round:1,turn:1,log:[],settings:Object.assign({daret:true,dlala:true,rounds:25,fast:false},settings),
    decks:{mektoub:shuffle(range(MEKTOUB.length)),baraka:shuffle(range(BARAKA.length))},
    pending:null,auction:null,trade:null,card:null,event:'',winner:null,over:false,landed:-1,seq:0,anims:[],ack:extra.ack||{}};
  SP.forEach((s,i)=>{if(isOwnable(i)) G.props[i]={owner:-1,houses:0,mort:false};});
  log(G,'start',{n:G.players.length,a:START_CASH});
  return G;
}
function gain(G,p,amt){p.cash+=amt; log(G,'collect',{p:p.name,a:amt}); A(G,{k:'fx',f:'gain',pid:p.id,amt});}
function payTax(G,p,amt,why,extra){pay(G,p,G.settings.daret?'daret':-1,amt,why,extra);}
function pay(G,p,to,amt,why,extra){
  if(amt<=0) return;
  p.cash-=amt; let dest='@bank';
  if(to==='daret'){G.daret+=amt; dest='@daret';}
  else if(typeof to==='number'&&to>=0){G.players[to].cash+=amt; dest=G.players[to].name;}

function wantValue(G,pid,i){

    if(others.size===1&&gi.filter(j=>G.props[j].owner===[...others][0]).length===gi.length-1) v*=1.3;}
  if(s.t==='rail') v*=1+0.15*RAILS.filter(r=>G.props[r].owner===pid).length;
  return v;
}
function botTradeValue(G,t){
  const bot=t.to,from=t.from; let v=t.cashGive-t.cashGet;
  const val=i=>G.props[i].mort?SP[i].price*0.5:SP[i].price;
  t.give.forEach(i=>v+=val(i)); t.get.forEach(i=>v-=val(i)*1.1);

  const cnt=pid=>Object.keys(GROUPS).filter(g=>ownsGroup(G,pid,g)).length;

  if(G.auction){const au=G.auction; const cap=Math.min(wantValue(G,seat,au.idx)*(0.85+Math.random()*0.3),p.cash-res/2); const gap=cap-au.high; return {seat,a:gap>=100?{t:'bid',inc:gap>1500?500:100}:{t:'pass'}};}

/* ---------- transport 1: inside Claude (db + room capabilities) ---------- */
async function claudeCaps(){
  if(CAPS) return CAPS;
  CAPS={db:null,room:null,user:null,canWrite:null};
  try{
    const c=window.claude; const [db,room,user]=await Promise.all([c.use('db'),c.use('room'),c.use('user')]);
    CAPS.db=db; CAPS.room=room; CAPS.user=user;
    if(user){const id=await user.id(); if(id) myCid=id; CAPS.canWrite=await user.can('data.write');}
  }catch(e){}
  return CAPS;
}
function ClaudeT(){
  const C=CAPS||{}; const t={kind:'claude',docRef:null,unsub:[],named:null,writing:false,dirty:false,reqWriting:false,reqDirty:false,dbWriteOk:true,pending:null};
  t.ready=()=>!!C.db; t.canHost=()=>!!C.db&&C.canWrite!==false;
  t.load=async code=>{const s=await C.db.doc('games/'+code).get(); return s.exists?s.data():null;};
  t.listMine=async()=>{const s=await C.db.collection('games').where('hostCid','==',myCid).limit(20).get(); return s.docs.map(d=>d.data());};
  t.joinRoom=async(code,asHost,onIntent)=>{
    if(!C.room) return;
    try{
      t.named=await C.room.join('mp-'+code);
      t.named.presence(asHost?{host:true,cid:myCid}:{cid:myCid,q:NET.myQ}).catch(()=>{});
      t.unsub.push(t.named.onPeers(ch=>{
        if(asHost) [...ch.joined,...ch.updated].forEach(pe=>{if(pe.isMe) return; const pr=pe.presence||{}; onIntent(pe.by||pr.cid,pr.q);});
        renderPresence();
      },()=>{}));
    }catch(e){t.named=null;}
  };
  t.host=async(code,onIntent)=>{
    t.docRef=C.db.doc('games/'+code);
    t.unsub.push(C.db.collection(`games/${code}/req`).onSnapshot(qs=>qs.docs.forEach(d=>{const x=d.data(); if(x) onIntent(x.cid,x.q);}),()=>{}));
    await t.joinRoom(code,true,onIntent);
  };

    t.pending=g; if(t.writing){t.dirty=true; return;}
    t.writing=true;
    try{do{t.dirty=false; await t.docRef.set(clone(t.pending));}while(t.dirty);}
    catch(e){toast(_t(e&&e.code==='quota_exceeded'?'store.full':'store.retry'));}
    t.writing=false;
  };
  t.join=async(code,onState)=>{
    t.docRef=C.db.doc('games/'+code);
    t.unsub.push(t.docRef.onSnapshot(s=>{if(s.exists){const d=s.data(); if(d) onState(d);}},()=>{}));
    await t.joinRoom(code,false);
  };
  t.send=q=>{
    if(t.named) t.named.presence({cid:myCid,q}).catch(()=>{});
    if(C.db&&t.dbWriteOk&&C.canWrite!==false) t.writeReq(q);
  };
  t.writeReq=async q=>{
    t.reqQ=q; if(t.reqWriting){t.reqDirty=true; return;}
    t.reqWriting=true;
    try{do{t.reqDirty=false; await C.db.doc(`games/${NET.code}/req/${myCid}`).set({cid:myCid,q:t.reqQ,at:Date.now()});}while(t.reqDirty);}
    catch(e){if(e&&e.code==='invalid_argument') t.dbWriteOk=false;}
    t.reqWriting=false;
  };
  t.onlineCids=()=>{if(!t.named) return null; const s=new Set(); t.named.peers().forEach(pe=>{const c=pe.by||(pe.presence&&pe.presence.cid); if(c) s.add(c);}); if(myCid) s.add(myCid); return s;};
  t.hostOnline=()=>{if(!t.named) return true; return t.named.peers().some(pe=>pe.presence&&pe.presence.host&&!pe.isMe);};
  t.leave=()=>{t.unsub.forEach(f=>{try{f();}catch(e){}}); t.unsub=[]; try{t.named&&t.named.leave();}catch(e){} t.named=null;};
  return t;
}

/* ---------- transport 2: anywhere else (public MQTT relay over secure WebSocket) ----------
   Every player keeps one connection to each relay below; the host's state is published as a
   retained message, so someone who opens the link gets the table straight away. Works on any
   network (mobile data, hotel wifi, school networks) because nobody connects to anybody directly.
   Security: the relays only ever see encrypted bytes on unguessable topic names. The key comes
   from the game code, the host signs every board it sends (and the game code itself is derived
   from the host's public key, so nobody else can pretend to be the host), each player signs their
   own moves, and a table code is encrypted so that only the host can read it. */
const RELAYS=(()=>{try{if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){const o=new URLSearchParams(location.search).get('relay'); if(o) return o.split(',');}}catch(e){} return ['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];})();

const hex=u=>[...u].map(x=>x.toString(16).padStart(2,'0')).join('');
const ECDSA={name:'ECDSA',namedCurve:'P-256'}, ECDH={name:'ECDH',namedCurve:'P-256'}, SIGN={name:'ECDSA',hash:'SHA-256'};

async function cidFrom(k){return 'k'+hex(await sha('mp2|cid|'+k.x+'|'+k.y)).slice(0,18);}
/* this device's keys: kept in IndexedDB so the private halves can never be read back, with a localStorage fallback */
let KEYS=null;
function idb(){return new Promise((res,rej)=>{let r; try{r=indexedDB.open('moropoly-keys',1);}catch(e){rej(e); return;} r.onupgradeneeded=()=>r.result.createObjectStore('k'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}

  if(KEYS) return KEYS; if(!SUB()) return null;

  if(!rec){const ls=lsGet('moropoly.keys.v1'); if(ls&&ls.sp){try{rec={s:{privateKey:await crypto.subtle.importKey('jwk',ls.sp,ECDSA,false,['sign'])},d:{privateKey:await crypto.subtle.importKey('jwk',ls.dp,ECDH,false,['deriveKey'])},sPub:ls.sPub,dPub:ls.dPub};}catch(e){rec=null;}}}

    const s=await crypto.subtle.generateKey(ECDSA,!db,['sign','verify']), d=await crypto.subtle.generateKey(ECDH,!db,['deriveKey']);
    const sPub=pubXY(await crypto.subtle.exportKey('jwk',s.publicKey)), dPub=pubXY(await crypto.subtle.exportKey('jwk',d.publicKey));
    rec={s:{privateKey:s.privateKey},d:{privateKey:d.privateKey},sPub,dPub};
    if(db){try{await idbPut(db,'v1',rec);}catch(e){db=null;}}
    if(!db){try{lsSet('moropoly.keys.v1',{sp:await crypto.subtle.exportKey('jwk',s.privateKey),dp:await crypto.subtle.exportKey('jwk',d.privateKey),sPub,dPub});}catch(e){}}
  }

const keyCache=new Map();
async function verifyKey(xy){const k=xy.x+'.'+xy.y; if(!keyCache.has(k)) keyCache.set(k,await crypto.subtle.importKey('jwk',jwkOf(xy,['verify']),ECDSA,false,['verify'])); return keyCache.get(k);}

async function seal(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)))); const o=new Uint8Array(12+ct.length); o.set(iv); o.set(ct,12); return o;}

/* the table code travels encrypted to the host's own key, so other people holding the link cannot read it */

  return {e:pubXY(await crypto.subtle.exportKey('jwk',e.publicKey)),iv:b64(iv),c:b64(ct)};

async function pinOpen(pe){
  try{const k=await crypto.subtle.deriveKey({name:'ECDH',public:await crypto.subtle.importKey('jwk',jwkOf(pe.e,[]),ECDH,false,[])},KEYS.dh,{name:'AES-GCM',length:256},false,['decrypt']);

  t.hostOnline=()=>t.isHost||(!!t.hostCid&&t.on.has(t.hostCid));
  t.leave=()=>{
    t.stopped=true; clearTimeout(t.pushT); clearInterval(t.hb);
    if(t.base){ if(!t.isHost&&myReq) pubAll(T(myReq),'',true); if(myOn) pubAll(T(myOn),'',true); if(t.isHost&&t.pendingG&&t.pendingG.over){clearTimeout(t.clearT); t.wipe(t.pendingG);} }
    setTimeout(()=>t.conns.forEach(c=>c.close()),900);
    if(t.wake){document.removeEventListener('visibilitychange',t.wake); removeEventListener('online',t.wake);}
  };
  return t;
}

/* ============================================================
   AUTHORITY: commit, push, intents
   ============================================================ */
function commit(){
  if(!G) return;
  G.updated=Date.now();
  if(MODE==='local') lsSet('moropoly.local.v2',G);
  if(MODE==='host'&&NET.T) NET.T.push(G);
  onState(clone(G));
}
function authorized(seat,cid){const p=G&&G.players[seat]; return !!p&&p.human&&p.cid===cid;}
function hostHandle(cid,q){
  if(!G||!cid||!Array.isArray(q)||cid===myCid) return;
  let last=G.ack[cid]||0, changed=false;
  for(const it of q.slice(-8)){
    if(!it||typeof it.s!=='number'||it.s<=last) continue;
    last=it.s;
    if(handleIntent(cid,it)) changed=true;
  }
  if(last!==(G.ack[cid]||0)){G.ack[cid]=last; changed=true;}
  if(changed) commit();
}
const hostPinOf=code=>{const v=lsGet('moropoly.pin.'+code); return v?String(v):'';};
function handleIntent(cid,it){
  const a=it.a||{};
  if(a.t==='join'){
    const seated=G.players.some(p=>p.cid===cid);
    if(G.pinOn&&!seated&&(!hostPinOf(G.code)||String(a.pin||'')!==hostPinOf(G.code))){G.denied=G.denied||{}; G.denied[cid]=(G.denied[cid]||0)+1; return true;}
    if(G.status==='lobby') return lobbyJoin(cid,a);
    if(G.status==='play') return playJoin(G,cid,a);
    return false;
  }
  if(G.status==='lobby'){
    if(a.t==='leave'){const n=G.players.length; G.players=G.players.filter(p=>p.cid!==cid); return n!==G.players.length;}
    return false;
  }
  if(G.status==='play'){
    const seat=+it.seat; if(!authorized(seat,cid)) return false;
    return apply(G,seat,a);
  }
  return false;
}
const freeToken=(G,want,except)=>{const used=new Set(G.players.filter(p=>p.cid!==except).map(p=>p.token)); if(want>=0&&want<TOKENS.length&&!used.has(want)) return want; const k=range(TOKENS.length).find(k=>!used.has(k)); return k==null?-1:k;};
function lobbyJoin(cid,a){
  const name=String(a.name||'').trim().slice(0,16)||t('lbl.player');
  let tok=+a.token;
  const mine=G.players.find(p=>p.cid===cid);
  if(!(tok>=0&&tok<TOKENS.length)||G.players.some(p=>p.token===tok&&p!==mine)){if(!a.auto&&mine) return false; tok=freeToken(G,tok,cid);}
  if(tok<0) return false;
  if(mine){mine.name=name; mine.token=tok; return true;}
  if(G.players.length>=8) return false;
  G.players.push({cid,name,token:tok,human:true});
  log(G,'joins',{p:name});
  return true;
}
/* someone opens the invite link after the game has started: they get a seat at the end of the turn order */
function playJoin(G,cid,a){
  const name=String(a.name||'').trim().slice(0,16)||t('lbl.player');
  const mine=G.players.find(p=>p.cid===cid);
  if(mine){ // changing name or token during the game
    let tok=+a.token; if(!(tok>=0&&tok<TOKENS.length)||G.players.some(p=>p!==mine&&!p.bankrupt&&p.token===tok)) tok=mine.token;
    if(mine.name===name&&mine.token===tok) return false;
    mine.name=name; mine.token=tok; return true;
  }
  if(G.over||G.players.length>=8) return false;
  const used=new Set(G.players.filter(p=>!p.bankrupt).map(p=>p.token));
  let tok=+a.token; if(!(tok>=0&&tok<TOKENS.length)||used.has(tok)) tok=range(TOKENS.length).find(k=>!used.has(k));
  if(tok==null) return false;
  const id=G.players.length;
  G.players.push({id,cid,name,token:tok,human:true,color:COLORS[id%COLORS.length],cash:START_CASH,pos:0,inJail:false,jailTurns:0,goojf:[],bankrupt:false,owes:-1,mt:'',lateRound:G.round});
  log(G,'joinsMid',{p:name});
  A(G,{k:'fx',f:'joined',pid:id});
  return true;
}
function sendIntent(it){
  const ack=(V&&V.ack&&V.ack[myCid])||0;
  NET.mySeq=Math.max(NET.mySeq,ack)+1;
  NET.myQ=NET.myQ.filter(x=>x.s>ack).concat([Object.assign({s:NET.mySeq},it)]).slice(-6);
  if(NET.T) NET.T.send(NET.myQ);
}
function dispatch(a,seat){
  if(!V) return;
  if(seat==null) seat=actorOf(V);
  if(MODE==='local'||MODE==='host'){
    if(MODE==='host'&&G.status==='play'&&!(G.players[seat]&&(G.players[seat].cid===myCid))) return;
    if(apply(G,seat,a)) commit(); else toast(t('toast.noMove'));
  } else {
    if(NET.T&&!NET.T.hostOnline()){toast(t('toast.hostOff'));}
    sendIntent({seat,a});
  }
}
function lobbyAct(a){
  if(MODE==='host'){
    if(a.t==='join'){if(lobbyJoin(myCid,a)) commit(); else toast(t('toast.taken'));}
    else if(a.t==='leave'){G.players=G.players.filter(p=>p.cid!==myCid); commit();}
  } else sendIntent({a});
}

const netErr=e=>{const k=e&&e.type; return t(k==='crypto'?'note.secure':k==='relay'?'conn.noRelay':k==='lib'?'err.lib':k==='unavailable-id'?'err.inUse':k==='browser-incompatible'?'err.browser':'err.conn');};
async function hostGame(){

  let code=rid(6), extra={};

  log(G,'tableSet');

  try{history.replaceState(null,'','#'+code);}catch(e){}

async function joinGame(code){

    MODE='host'; G=clone(saved);

    V=null; commit(); return;
  }
  if(T.kind==='claude'&&!saved){toast(t('toast.noGame',{c:code.toUpperCase()})); teardownNet(); return;}
  MODE='guest'; G=null; V=null;

  try{await T.join(code,d=>onState(clone(d)));}catch(e){toast(netErr(e)); goHome(); return;}

function onState(ns){

const DIE_ROT={1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,180]};
const spins=[0,0];
function setDice(d,anim){

function cellBox(i){const c=$('c'+i); if(!c) return {x:0,y:0,w:0,h:0}; return {x:c.offsetLeft+c.offsetWidth/2,y:c.offsetTop+c.offsetHeight/2,w:c.offsetWidth,h:c.offsetHeight};}
function pawnSize(){const b=$('board'); if(!b) return 30; const w=b.offsetWidth; return w*(w<480?0.06:0.047);}
function syncDpos(){dpos={}; if(V&&V.players) V.players.forEach(p=>dpos[p.id]=p.pos);}
function slotXY(pid,pos){
  const here=V.players.filter(p=>!p.bankrupt&&dpos[p.id]===pos).map(p=>p.id);
  const k=Math.max(0,here.indexOf(pid)), n=Math.max(1,here.length), b=cellBox(pos), s=pawnSize();
  const cols=n<=2?n:n<=4?2:n<=6?3:4, rows=Math.ceil(n/cols);
  const gap=s*0.62;

function layoutPawns(){

/* ---------- animations ---------- */
async function runAnim(a){
  if(!$('board')) return;
  const sp=speed(), rm=reduceMotion();
  switch(a.k){
    case 'dice':{sfx('dice'); setTimeout(()=>sfx('land'),rm?50:820*sp); setDice(a.d,!rm); setEvent(tl(['rolls',{p:pname(a.pid),d1:a.d[0],d2:a.d[1]}])+(a.d[0]===a.d[1]?t('ev.double'):'')); await sleep(rm?100:950*sp); break;}
    case 'move':{
      const el=$('pw'+a.pid); if(!el){dpos[a.pid]=(a.from+a.steps)%40; break;}
      el.style.zIndex=4;
      for(let s=1;s<=a.steps;s++){
        const from=slotXY(a.pid,dpos[a.pid]); dpos[a.pid]=(a.from+s)%40; const to=slotXY(a.pid,dpos[a.pid]);
        const dur=rm?0:Math.max(70,190*sp), hop=pawnSize()*0.9; sfx('step');
        if(dur){await el.animate([{transform:`translate(${from.x}px,${from.y}px) scale(1)`},{transform:`translate(${(from.x+to.x)/2}px,${(from.y+to.y)/2-hop}px) scale(1.18)`,offset:.5},{transform:`translate(${to.x}px,${to.y}px) scale(1)`}],{duration:dur,easing:'ease-in-out'}).finished;}
        el.style.transform=`translate(${to.x}px,${to.y}px)`;
      }
      if(!rm) el.animate([{transform:el.style.transform+' scale(1.25,0.8)'},{transform:el.style.transform+' scale(1)'}],{duration:260,easing:'cubic-bezier(.3,1.6,.5,1)'});
      el.style.zIndex=''; layoutPawns(); highlight(dpos[a.pid]);
      break;}
    case 'jump':{sfx(a.f==='jail'?'jail':'whoosh');
      const el=$('pw'+a.pid); const from=el?slotXY(a.pid,dpos[a.pid]):null; dpos[a.pid]=a.to; const to=slotXY(a.pid,a.to);
      if(el&&!rm){el.style.zIndex=4; await el.animate([{transform:`translate(${from.x}px,${from.y}px) scale(1)`},{transform:`translate(${(from.x+to.x)/2}px,${(from.y+to.y)/2-pawnSize()*3}px) scale(1.5)`,offset:.5},{transform:`translate(${to.x}px,${to.y}px) scale(1)`}],{duration:700*sp+200,easing:'ease-in-out'}).finished; el.style.zIndex='';}
      layoutPawns(); highlight(a.to);
      if(a.f==='jail'){jailBars(); await revealArt(SP[30].art,t('fl.jail'),1300*sp);}
      break;}
    case 'card':{sfx('card'); setEvent(t('ev.draws',{p:pname(a.pid),deckN:t('deck.'+a.deck)})); {const tx=cardText(a.deck,a.id,a.text); await showFate(a.deck,tx,(rm?2500:Math.min(9000,4000+tx.length*40))*(sp<1?.75:1));} break;}
    case 'turn':{setEvent(tl(['turn',{p:pname(a.pid)}])); if(MODE!=='local'&&iControl(a.pid)){sfx('myturn'); try{navigator.vibrate&&navigator.vibrate([60,40,60]);}catch(e){}} break;}
    case 'fx':{
      if(a.f==='deed'){sfx('deed'); await revealArt(SP[a.idx].art||null,`${spN(a.idx)} · ${fmt(SP[a.idx].price)}`,1300*sp,SP[a.idx]);}
      else if(a.f==='buy'){sfx('buy'); floatAt(a.pid,t('fl.sold'),'gold'); confettiAt(cellBox(a.idx)); await sleep(500*sp);}
      else if(a.f==='pay'){sfx('pay'); floatAt(a.pid,'−'+fmt(a.amt),'minus'); if(a.to>=0) setTimeout(()=>floatAt(a.to,'+'+fmt(a.amt),'plus'),300); await sleep(450*sp);}
      else if(a.f==='gain'||a.f==='go'){sfx('coin'); floatAt(a.pid,'+'+fmt(a.amt),'plus'); await sleep(350*sp);}
      else if(a.f==='daret'){sfx('coins'); floatAt(a.pid,t('fl.daret')+' +'+fmt(a.amt),'gold'); confettiAt(cellBox(20)); await sleep(700*sp);}
      else if(a.f==='build'){sfx('build'); const h=$('h'+a.idx); if(h){const p=PEND||V; const pr=p.props[a.idx]; h.innerHTML=houseHTML(pr.houses); h.lastElementChild&&h.lastElementChild.classList.add('pop');} await sleep(220*sp);}
      else if(a.f==='deal'){sfx('deal'); floatAt(a.pid,t('fl.deal'),'gold'); floatAt(a.to,t('fl.deal'),'gold'); await sleep(500*sp);}
      else if(a.f==='dlala'){sfx('gavel'); setEvent(t('ev.dlala')); await sleep(400);}
      else if(a.f==='bankrupt'){sfx('sad'); floatAt(a.pid,t('fl.bankrupt'),'minus'); await sleep(800*sp);}
      else if(a.f==='joined'){sfx('deed'); confettiAt(cellBox(0)); floatAt(a.pid,'+'+fmt(START_CASH),'plus'); await sleep(500*speed());}
      else if(a.f==='win'){sfx('zaghrouta'); confettiAt(null,260); await sleep(1200);}
      break;}
  }
}

function confettiAt(box,count){

  const cx=box?box.x:W/2, cy=box?box.y:H/2, n=count||70, cols=['#c1272d','#e8474d','#006233','#17a862','#f4f6f9','#c9cfd8','#e3b34a'];

let stash=null; // a minimised window parked while another one (a deed card) is open
function openModal(kind,html){

  if(modal&&modal.min&&kind!==modal.kind&&!stash){const f=document.createElement('div'); while(root.firstChild) f.appendChild(root.firstChild); stash={modal,f};}
  else if(stash&&stash.modal.kind===kind) stash=null;

  root.innerHTML=`<div class="veil" id="veil"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`+(MINABLE.includes(kind)?`<button class="modal-pill" id="modalPill">${esc(t('pill.'+kind))}</button>`:'');
  if(MINABLE.includes(kind)) addMinBtn(root);

function addMinBtn(root){

function minimizeModal(){if(!modal) return; modal.min=true; $('modalRoot').classList.add('min');}
function restoreModal(){if(!modal) return; modal.min=false; $('modalRoot').classList.remove('min'); if(modal.kind==='auction') renderAuction();}
function closeModal(){

  if(stash){const st=stash; stash=null; while(st.f.firstChild) root.appendChild(st.f.firstChild); modal=st.modal; root.classList.add('min'); const p=root.querySelector('#modalPill'); if(p) p.onclick=restoreModal; const m=root.querySelector('[data-min]'); if(m) m.onclick=minimizeModal; autoModals();}

function flagAnim(){
  const cv=$('flag'); if(!cv) return; const x=cv.getContext('2d'); const W=cv.width,H=cv.height;
  const off=document.createElement('canvas'); const fw=W-24, fh=H-28; off.width=fw; off.height=fh; const o=off.getContext('2d');
  o.fillStyle='#c1272d'; o.fillRect(0,0,fw,fh);
  const cx=fw/2,cy=fh/2,R=fh*0.32; const pts=range(5).map(k=>{const a=-Math.PI/2+k*2*Math.PI/5; return [cx+Math.cos(a)*R,cy+Math.sin(a)*R];});

  function frame(now){
    const t=(now-t0)/1000; x.clearRect(0,0,W,H);
    const pg=x.createLinearGradient(0,0,8,0); pg.addColorStop(0,'#8f97a2'); pg.addColorStop(.5,'#f4f6f9'); pg.addColorStop(1,'#7f8792');

    for(let i=0;i<fw;i+=2){
      const k=i/fw, ph=t*3.2-i*0.06, dy=rm?0:Math.sin(ph)*5*k, sh=rm?0:Math.cos(ph)*0.16*k;
      x.drawImage(off,i,0,2,fh,12+i,10+dy,2,fh);
      x.fillStyle=sh>0?`rgba(255,255,255,${sh})`:`rgba(0,0,0,${-sh})`; x.fillRect(12+i,10+dy,2,fh);
    }
    if(!rm&&!$('home').hidden) requestAnimationFrame(frame); else if(!rm) setTimeout(()=>requestAnimationFrame(frame),500);
  }
  requestAnimationFrame(frame);
}

function actx(){
  if(AU.ctx) return AU.ctx;
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
  const c=new C(); AU.ctx=c;
  const comp=c.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=3; comp.connect(c.destination);
  AU.master=c.createGain(); AU.master.gain.value=1; AU.master.connect(comp);
  AU.music=c.createGain(); AU.sfx=c.createGain(); AU.music.connect(AU.master); AU.sfx.connect(AU.master);
  // small room reverb
  const len=c.sampleRate*1.6, ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
  const conv=c.createConvolver(); conv.buffer=ir; const rg=c.createGain(); rg.gain.value=.22; conv.connect(rg); rg.connect(AU.master); AU.rev=conv;
  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate), nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1; AU.noise=nb;
  applyVolumes();

}

  const c=AU.ctx, sr=c.sampleRate, N=Math.max(2,Math.round(sr/f)), L=Math.floor(sr*dur), b=c.createBuffer(1,L,sr), y=b.getChannelData(0);
  let last=0; for(let i=0;i<N;i++){const r=Math.random()*2-1; last=last+bright*(r-last); y[i]=last;}
  y[N]=decay*y[0]; for(let i=N+1;i<L;i++) y[i]=decay*0.5*(y[i-N]+y[i-N-1]);
  return AU.ks[key]=b;
}
function pluck(t,f,vel,bus,o){o=o||{}; const c=AU.ctx; const s=c.createBufferSource(); s.buffer=ksBuf(f,o.decay||.996,o.bright||.5,o.dur||1.6); const g=c.createGain(); g.gain.value=vel; let n=g;
  if(o.lp){const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=nyq(o.lp); g.connect(fl); n=fl;}
  if(o.body){const pk=c.createBiquadFilter(); pk.type='peaking'; pk.frequency.value=o.body; pk.gain.value=6; pk.Q.value=1.2; n.connect(pk); n=pk;}
  s.connect(g); out(n,bus,o.wet||.3); s.start(t);}
const nyq=f=>Math.min(f,AU.ctx.sampleRate*0.45);
function noiseHit(t,dur,type,freq,q,vel,bus,wet){const c=AU.ctx; freq=nyq(freq); const s=c.createBufferSource(); s.buffer=AU.noise; const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q||1; const g=env(t,.002,vel,dur); s.connect(f); f.connect(g); out(g,bus,wet||.15); s.start(t,Math.random()*.5,dur+.05);}
function tone(t,f0,f1,dur,vel,type,bus,wet){const c=AU.ctx; const o=c.createOscillator(); o.type=type||'sine'; o.frequency.setValueAtTime(f0,t); if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur*.8); const g=env(t,.004,vel,dur); o.connect(g); out(g,bus,wet||0); o.start(t); o.stop(t+dur+.05);}
const doum=(t,v,b)=>{tone(t,120,52,.32,v*.9,'sine',b,.1); noiseHit(t,.03,'lowpass',400,1,v*.2,b);};
const tek=(t,v,b)=>{noiseHit(t,.045,'highpass',3200,.8,v*.35,b,.2); tone(t,1100,700,.04,v*.15,'triangle',b);};
const qraqeb=(t,v,b)=>{noiseHit(t,.035,'bandpass',3400,2.2,v*.5,b,.25); noiseHit(t+.018,.03,'bandpass',4600,2.5,v*.35,b,.25);};
const bendir=(t,v,b)=>{tone(t,85,48,.4,v*.7,'sine',b,.15); noiseHit(t,.16,'bandpass',1300,.9,v*.22,b,.15);};
const riq=(t,v,b)=>{noiseHit(t,.07,'highpass',6500,.7,v*.28,b,.3);};
const clap=(t,v,b)=>{for(let k=0;k<3;k++) noiseHit(t+k*.011,.05,'bandpass',1500,1.1,v*.3,b,.3);};
function bowed(t,f,dur,vel,b){const c=AU.ctx; const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=f;
  const lfo=c.createOscillator(); lfo.frequency.value=5.6; const lg=c.createGain(); lg.gain.value=f*.006; lfo.connect(lg); lg.connect(o.frequency);
  const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=nyq(2400); fl.Q.value=.7;
  const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vel,t+.08); g.gain.setValueAtTime(vel,t+dur*.75); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(fl); fl.connect(g); out(g,b,.35); o.start(t); o.stop(t+dur+.05); lfo.start(t); lfo.stop(t+dur+.05);}
const hz=n=>440*Math.pow(2,(n-69)/12); // midi → Hz
/* --- music: Hamza's track, looped with a soft crossfade --- */
function musicEl(i){
  if(AU.els[i]) return AU.els[i];
  const a=new Audio(); a.src=curTrack().src; a.preload=i===0?'auto':'metadata'; a.setAttribute('playsinline','');
  let g=null;
  try{const src=AU.ctx.createMediaElementSource(a); g=AU.ctx.createGain(); g.gain.value=0; src.connect(g); g.connect(AU.music);}catch(e){g=null;}
  a.addEventListener('ended',()=>{if(AU.playing&&!AU.xfading){a.currentTime=0; a.play().catch(()=>{});}});
  a.addEventListener('error',()=>{AU.playing=false; renderDock();});
  return AU.els[i]={a,g};
}
function checkLoop(){
  if(!AU.playing||AU.xfading) return;
  const e=AU.els[AU.cur]; const d=e&&e.a.duration; if(!d||!isFinite(d)) return;
  if(e.a.currentTime>d-2.6){
    AU.xfading=true; const n=1-AU.cur, ne=musicEl(n), t=AU.ctx.currentTime;
    ne.a.currentTime=0; ne.a.play().catch(()=>{});
    if(ne.g){ne.g.gain.cancelScheduledValues(t); ne.g.gain.setValueAtTime(0.0001,t); ne.g.gain.linearRampToValueAtTime(1,t+2.2);}
    if(e.g){e.g.gain.cancelScheduledValues(t); e.g.gain.setValueAtTime(e.g.gain.value,t); e.g.gain.linearRampToValueAtTime(0,t+2.4);}
    setTimeout(()=>{e.a.pause(); AU.cur=n; AU.xfading=false;},2600);
  }
}
function startMusic(){
  if(!AU.set.music||!AU.unlocked) return; const c=actx(); if(!c) return;
  if(c.state==='suspended') c.resume();
  if(AU.playing) return;
  const e=musicEl(AU.cur); const t=c.currentTime;
  if(e.g){e.g.gain.cancelScheduledValues(t); e.g.gain.setValueAtTime(0.0001,t); e.g.gain.linearRampToValueAtTime(1,t+1.5);}
  e.a.play().then(()=>{AU.playing=true; renderDock();}).catch(()=>{AU.playing=false; renderDock();});
  AU.playing=true; clearInterval(AU.loop); AU.loop=setInterval(checkLoop,250); applyVolumes(); renderDock();
}
function stopMusic(){AU.playing=false; AU.xfading=false; clearInterval(AU.loop); AU.els.forEach(e=>{try{e.a.pause();}catch(x){}}); renderDock();}
function setTrack(i){
  if(!(i>=0&&i<TRACKS.length)) return;
  const same=i===AU.set.track&&AU.playing; AU.set.track=i; AU.set.music=true; saveAudio();
  if(same){renderDock(); return;}
  AU.playing=false; AU.xfading=false; clearInterval(AU.loop);
  AU.els.forEach(e=>{try{e.a.pause(); if(e.g) e.g.disconnect(); e.a.removeAttribute('src'); e.a.load();}catch(x){}});
  AU.els=[]; AU.cur=0; unlockAudio(); applyVolumes(); startMusic(); renderDock();
}
function toggleMusic(on){AU.set.music=on==null?!AU.set.music:on; saveAudio(); applyVolumes(); if(AU.set.music) startMusic(); else setTimeout(()=>{if(!AU.set.music) stopMusic();},300); renderDock();}
function unlockAudio(){if(AU.unlocked) return; AU.unlocked=true; const c=actx(); if(c&&c.state==='suspended') c.resume(); if(AU.set.music) startMusic();}
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,unlockAudio,{passive:true}));
document.addEventListener('visibilitychange',()=>{
  if(!AU.ctx) return;
  if(document.hidden){if(AU.playing){AU.els.forEach(e=>{try{e.a.pause();}catch(x){}}); AU.resumeOnShow=true; AU.playing=false;} if(MODE!=='host') AU.ctx.suspend();}
  else{AU.ctx.resume(); if(AU.resumeOnShow&&AU.set.music){AU.resumeOnShow=false; startMusic();}}
});
/* --- sound effects --- */
function sfx(name){
  if(!AU.set.sfx||!AU.unlocked) return; const c=actx(); if(!c) return; if(c.state==='suspended') c.resume();
  const t=c.currentTime+.01, b=AU.sfx;
  switch(name){
    case 'dice': for(let k=0;k<7;k++) noiseHit(t+k*.07+Math.random()*.03,.03,'bandpass',1800+Math.random()*1500,2,.5,b,.1); break;
    case 'land': tone(t,180,90,.12,.5,'sine',b); noiseHit(t,.05,'bandpass',900,1.5,.35,b); break;
    case 'step': tone(t,620+Math.random()*80,420,.05,.18,'triangle',b); break;
    case 'whoosh': noiseHit(t,.35,'bandpass',800,.6,.35,b,.3); break;
    case 'card': noiseHit(t,.12,'highpass',2500,.7,.3,b,.2); tone(t+.05,880,1320,.18,.12,'sine',b,.3); break;
    case 'deed': pluck(t,hz(74),.5,b,{decay:.995,bright:.6,dur:1.2,wet:.5}); pluck(t+.08,hz(81),.4,b,{decay:.995,bright:.6,dur:1.2,wet:.5}); break;
    case 'buy': [74,78,81,86].forEach((n,k)=>tone(t+k*.07,hz(n),0,.25,.2,'triangle',b,.3)); qraqeb(t+.3,.8,b); qraqeb(t+.42,.6,b); break;
    case 'coin': tone(t,1975,0,.12,.18,'sine',b,.2); tone(t+.08,2637,0,.25,.16,'sine',b,.3); break;
    case 'pay': tone(t,1320,880,.18,.16,'triangle',b,.2); tone(t+.1,990,660,.22,.14,'triangle',b,.2); break;
    case 'coins': for(let k=0;k<8;k++) tone(t+k*.06,1800+Math.random()*900,0,.15,.12,'sine',b,.3); break;
    case 'build': tek(t,1,b); tek(t+.09,.8,b); tone(t,330,0,.1,.2,'square',b); break;
    case 'gavel': tone(t,220,110,.15,.5,'sine',b,.2); noiseHit(t,.04,'lowpass',1500,1,.5,b); break;
    case 'jail': [196,233,277].forEach(f=>tone(t,f,f*.98,1.1,.16,'sawtooth',b,.5)); noiseHit(t,.3,'lowpass',500,1,.5,b,.4); break;
    case 'myturn': tone(t,hz(81),0,.2,.15,'sine',b,.3); tone(t+.12,hz(86),0,.35,.15,'sine',b,.4); break;
    case 'deal': clap(t,1,b); clap(t+.15,1,b); break;
    case 'sad': [62,61,60,57].forEach((n,k)=>tone(t+k*.18,hz(n),0,.3,.14,'triangle',b,.3)); break;
    case 'zaghrouta':{ // ululation of joy for the winner
      const o=c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(1250,t); o.frequency.linearRampToValueAtTime(1500,t+2.2);
      const l=c.createOscillator(); l.type='square'; l.frequency.value=8.5; const lg=c.createGain(); lg.gain.value=140; l.connect(lg); lg.connect(o.frequency);
      const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(.12,t+.1); g.gain.setValueAtTime(.12,t+2); g.gain.exponentialRampToValueAtTime(0.0001,t+2.5);
      o.connect(g); out(g,b,.4); o.start(t); l.start(t); o.stop(t+2.6); l.stop(t+2.6);
      [0,.25,.5,.75,1,1.25].forEach(d=>{doum(t+d,.7,b); qraqeb(t+d+.12,.7,b);}); break;}
  }
}
/* --- music dock UI --- */
function renderDock(){
  const d=$('dock'); if(!d) return;
  const on=AU.set.music&&AU.playing;
  $('dockBtn').classList.toggle('on',on); $('dockBtn').setAttribute('aria-label',on?t('dk.ariaOn'):t('dk.aria'));
  const p=$('dockPanel'); if(p.hidden) return;
  p.innerHTML=`<div class="dk-row"><b>${t('dk.music')}</b><button class="sw" role="switch" aria-checked="${AU.set.music}" id="dkMusic" aria-label="${t('dk.music')}"><i></i></button></div>
    <div class="dk-tracks" role="group" aria-label="${t('dk.pick')}">${TRACKS.map((tr,i)=>{const sel=curTrack()===tr; return `<button type="button" class="dk-track" data-trk="${i}" aria-pressed="${sel&&AU.set.music}"><span class="ar" style="min-width:auto">${tr.ic}</span><span><b>${esc(t('trk.'+tr.k))}</b><small>${esc(t('trk.'+tr.k+'.d'))}${sel&&on?' · '+t('dk.loop'):''}</small></span></button>`;}).join('')}</div>
    <label class="dk-row" for="dkVol"><span>${t('dk.vol')}</span><input type="range" id="dkVol" min="0" max="1" step="0.05" value="${AU.set.vol}"><span class="muted" id="dkVolN" style="min-width:34px;text-align:end">${Math.round(AU.set.vol*100)}%</span></label>
    <div class="dk-row"><b>${t('dk.sfx')}</b><button class="sw" role="switch" aria-checked="${AU.set.sfx}" id="dkSfx" aria-label="${t('dk.sfx')}"><i></i></button></div>
    <div class="muted" style="font-size:11.5px">${t('dk.m')}</div>`;
  $('dkMusic').onclick=()=>toggleMusic();
  p.querySelectorAll('[data-trk]').forEach(b=>b.onclick=e=>{e.stopPropagation(); setTrack(+b.dataset.trk);});
  $('dkSfx').onclick=()=>{AU.set.sfx=!AU.set.sfx; saveAudio(); applyVolumes(); renderDock(); if(AU.set.sfx) sfx('coin');};
  $('dkVol').oninput=e=>{AU.set.vol=+e.target.value; $('dkVolN').textContent=Math.round(AU.set.vol*100)+'%'; saveAudio(); applyVolumes();};
}
function initDock(){
  $('dockBtn').onclick=e=>{e.stopPropagation(); unlockAudio(); const p=$('dockPanel'); p.hidden=!p.hidden; renderDock();};
  document.addEventListener('click',e=>{const p=$('dockPanel'); if(!p.hidden&&!e.target.closest('#dock')){p.hidden=true;}});
  addEventListener('keydown',e=>{if((e.key==='m'||e.key==='M')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){unlockAudio(); toggleMusic(); toast(AU.set.music?t('toast.musicOn'):t('toast.musicOff'));}});
  renderDock();
}
